# docker-compose.override.yml — Solo desarrollo local
#
# Docker Compose carga este archivo automáticamente junto a docker-compose.yml.
# Añade volúmenes para hot-reload y scripts de utilidad.
#
# NO se usa en Dokploy (en Dokploy solo se indica docker-compose.yml).

services:
  backend:
    build:
      context: ./backend
      args:
        INSTALL_DEV_REQS: "true"
    environment:
      APP_ENV: ${APP_ENV:-development}
      # SEC-03: Sin credenciales hardcodeadas.
      # Para desarrollo local, crear backend/.env con valores seguros o usar vacíos.
      SECRET_KEY: ${SECRET_KEY:-}
      MQTT_USERNAME: ${MQTT_USERNAME:-}
      MQTT_PASSWORD: ${MQTT_PASSWORD:-}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      DATABASE_URL: ${DATABASE_URL:-mysql+pymysql://root:${MYSQL_ROOT_PASSWORD:-}@mysql:3306/${MYSQL_DATABASE:-manttoai_db}}
    volumes:
      - ./backend:/app
      - ./scripts:/scripts:ro
      - ./iot/simulator:/simulator:ro
      # Montar iot/ para que test_mqtt_simulator.py pueda resolver el path relativo
      # desde backend/tests/ → ../../iot/simulator/mqtt_simulator.py
      - ./iot:/iot:ro

  frontend:
    build:
      context: ./frontend
      target: dev
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:8000/api/v1
    # Sobreescribir healthcheck para Vite dev server
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:5173 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  mosquitto:
    environment:
      MQTT_USERNAME: ${MQTT_USERNAME:-}
      MQTT_PASSWORD: ${MQTT_PASSWORD:-}
    # El entrypoint genera el passwd desde variables de entorno si no existe.
    # Para usar credenciales pre-generadas, ejecutar: make setup-mqtt-creds

  mysql:
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-}

  redis:
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}

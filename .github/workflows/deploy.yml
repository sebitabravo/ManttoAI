name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        default: 'production'
        type: choice
        options:
          - production

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ${{ github.event.inputs.environment || 'production' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Detect project structure
        id: project_check
        run: |
          if [ -f docker-compose.yml ]; then
            echo "has_compose=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_compose=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy to VPS via SSH
        if: steps.project_check.outputs.has_compose == 'true'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            # Navigate to project directory
            cd ${{ secrets.VPS_PROJECT_PATH }}
            
            # Pull latest changes without overwriting local state silently
            echo "📦 Pulling latest changes..."
            git fetch origin main
            git checkout main
            if [ -n "$(git status --porcelain)" ]; then
              echo "❌ Remote worktree has uncommitted changes; aborting deploy." >&2
              exit 1
            fi
            git pull --ff-only origin main
            
            # Production secrets must exist outside Git; never create them from a template.
            if [ ! -f .env ]; then
              echo "❌ .env not found on the deployment host; configure secrets before deploy." >&2
              exit 1
            fi

            docker compose config --quiet
            
            # Pull latest images
            echo "🐳 Pulling latest Docker images..."
            docker compose pull
            
            # Restart services
            echo "🚀 Restarting services..."
            docker compose up -d --build
            
            # Wait for a real backend liveness response, not only container state.
            echo "⏳ Waiting for backend health..."
            for attempt in $(seq 1 30); do
              if curl --fail --silent --show-error http://127.0.0.1:8000/health >/dev/null; then
                break
              fi
              if [ "$attempt" -eq 30 ]; then
                echo "❌ Backend health check failed after restart." >&2
                docker compose ps
                docker compose logs --tail 50 backend
                exit 1
              fi
              sleep 2
            done

            if ! curl --fail --silent --show-error http://127.0.0.1:8000/ready >/dev/null; then
              echo "❌ Backend readiness check failed after restart." >&2
              docker compose ps
              docker compose logs --tail 50 backend
              exit 1
            fi
            
            # Check service status
            echo "📊 Service status:"
            docker compose ps
            
            # Show only recent service state after the verified checks.
            echo "📝 Recent logs:"
            docker compose logs --tail 20 backend

      - name: Verify deployment
        if: steps.project_check.outputs.has_compose == 'true'
        run: |
          echo "✅ Deployment completed and remote /health + /ready checks passed"

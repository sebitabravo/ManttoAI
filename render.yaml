# Blueprint opcional para el backend en Render.
# Completar los valores sync:false en el dashboard; este archivo no publica secretos.
services:
  - type: web
    name: manttoai-api
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./backend/Dockerfile.render
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_AUTO_INIT
        value: "true"
      - key: ALLOW_SCHEMA_AUTO_CREATE
        value: "true"
      - key: ALLOW_RUNTIME_SCHEMA_CHANGES
        value: "true"
      - key: SECRET_KEY
        generateValue: true
      - key: ENABLE_API_DOCS
        value: "true"
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: MQTT_ENABLED
        value: "false"
      - key: SIMULATOR_ENABLED
        value: "true"
      - key: SIMULATOR_INTERVAL_SECONDS
        value: "60"
      - key: TELEMETRY_RETENTION_DAYS
        value: "30"
      - key: ENABLE_PREDICTION_SCHEDULER
        value: "true"
      - key: PREDICTION_INTERVAL_SECONDS
        value: "120"
      - key: PREDICTION_SCHEDULER_MAX_WORKERS
        value: "1"
      - key: ML_AUTO_TRAIN_ON_MISSING
        value: "false"
      - key: REDIS_URL
        value: ""
      - key: REDIS_PASSWORD
        value: ""
      - key: OLLAMA_URL
        value: ""
      - key: SMTP_HOST
        value: ""
      - key: TRUSTED_PROXY_IPS
        value: ""
      - key: SEED_ADMIN_EMAIL
        value: "admin@manttoai.local"
      - key: SEED_ADMIN_PASSWORD
        sync: false
      - key: SEED_TECNICO_EMAIL
        value: "tecnico@manttoai.local"
      - key: SEED_TECNICO_PASSWORD
        sync: false
      - key: SEED_DEMO_EMAIL
        value: "demo@manttoai.local"
      - key: SEED_DEMO_PASSWORD
        sync: false
      - key: SEED_ALLOW_NON_DEV
        value: "true"
